<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>mõdRïff App Store creative assets</title>
<style>
@font-face {
  font-family: Outfit;
  src: url(../../../fonts/outfit-latin-700-normal.woff2);
  font-weight: 700;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 3840px; height: 1646px; overflow: hidden; }
html.search, .search body { height: 2560px; }
body {
  position: relative;
  color: #f7f7ff;
  font-family: Outfit, sans-serif;
  background:
    radial-gradient(ellipse at 14% 72%, #49272b 0, transparent 41%),
    radial-gradient(ellipse at 84% 37%, #252852 0, transparent 43%),
    radial-gradient(ellipse at 56% 76%, #162c40 0, transparent 41%),
    #080a14;
}
.field {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, #c2c3ff39 2px, transparent 3px) 0 0 / 56px 56px;
  mask-image: radial-gradient(ellipse, transparent 12%, #000 55%, transparent 89%);
}
.traces { position: absolute; inset: 0; }
.core {
  position: absolute;
  left: 1097px;
  top: 493px;
  width: 1646px;
  height: 661px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}
.copy { display: flex; flex-direction: column; align-items: center; gap: 38px; }
.wordmark { display: block; width: 1050px; height: auto; }
.line {
  margin: 0;
  font-size: 128px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -4px;
  white-space: nowrap;
  text-shadow: 0 12px 64px #080a14;
}
.line span { color: #b7c7ff; }
.search .core {
  left: 836px;
  top: 765px;
  width: 2168px;
  height: 1030px;
  flex-direction: row;
  gap: 84px;
}
.search .copy { width: 952px; flex-shrink: 0; align-items: flex-start; gap: 44px; }
.search .wordmark { width: 680px; }
.search .line { font-size: 143px; line-height: 1.01; }
.search .line span { display: block; }
.interface {
  width: 1030px;
  height: 868px;
  overflow: hidden;
  border: 5px solid #545982;
  border-radius: 60px;
  box-shadow: 0 32px 95px #03050bc9, 0 0 120px #6e77f244;
  flex-shrink: 0;
  position: relative;
}
.interface img { position: absolute; top: -155px; left: 0; width: 1020px; }
</style>
<body>
<div class="field" aria-hidden="true"></div>
<canvas class="traces" width="3840" height="1646" aria-hidden="true"></canvas>
<main class="core">
  <div class="copy">
    <img class="wordmark" src="splash-logo.svg" alt="mõdRïff">
    <h1 class="line">Make Music <span>Without Limits</span></h1>
  </div>
</main>
<script>
const search = new URLSearchParams(location.search).get('placement') === 'search';
const core = document.querySelector('.core');
if (search) {
  document.documentElement.classList.add('search');
  core.insertAdjacentHTML('beforeend', `
    <div class="interface">
      <img src="../screenshots/v7.1-captioned/raw/iphone-01-live.png" alt="Live chord pads in mõdRïff">
    </div>
  `);
}

const canvas = document.querySelector('.traces');
if (search) canvas.height = 2560;
const ctx = canvas.getContext('2d');
const { width, height } = canvas;
const gradient = ctx.createLinearGradient(0, 0, width, 0);
gradient.addColorStop(0, '#f68e78');
gradient.addColorStop(0.25, '#ffbd88');
gradient.addColorStop(0.43, '#ddc8e500');
gradient.addColorStop(0.57, '#a6adff00');
gradient.addColorStop(0.76, '#899dff');
gradient.addColorStop(1, '#be8dff');
ctx.strokeStyle = gradient;

// Fan out toward the edges so the brightest traces sit away from the copy.
for (let trace = -10; trace <= 10; trace++) {
  ctx.beginPath();
  for (let x = 0; x <= width; x += 8) {
    const along = (x - width / 2) / (width / 2);
    const fan = Math.pow(Math.abs(along), 1.15);
    const wave = Math.sin(along * 5 + trace * 0.066) * (0.13 + fan * 0.16);
    const y = height * (0.51 + wave + trace * (0.005 + fan * 0.012));
    if (x === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.lineWidth = trace === 0 ? 5 : 2.5;
  ctx.globalAlpha = trace === 0 ? 0.74 : 0.32 - Math.abs(trace) * 0.017;
  ctx.stroke();
}
</script>
</body>
</html>
