<!doctype html>
<meta charset="utf-8">
<!-- Rendered at the exact store size by build.sh. Query: w, h, cap (caption), img (raw capture). -->
<style>
@font-face{font-family:Outfit;font-weight:600;src:url(../../../fonts/outfit-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Orbitron;font-weight:700;src:url(../../../fonts/orbitron-latin-700-normal.woff2) format('woff2')}
html,body{margin:0;padding:0;background:#05060c;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;font-family:Outfit,sans-serif}
.cap{flex:none;display:flex;align-items:center;justify-content:center;text-align:center;color:#eef0fb;font-weight:600;letter-spacing:.01em;line-height:1.12;padding:0 6%;box-sizing:border-box;width:100%}
.shot{flex:1 1 0;min-height:0;display:flex;align-items:flex-start;justify-content:center;width:100%}
.shot img{display:block;height:100%;width:auto;object-fit:contain;object-position:top}
</style>
<div class="cap" id="cap"></div>
<div class="shot"><img id="im"></div>
<script>
const q=new URLSearchParams(location.search),W=+q.get('w'),H=+q.get('h');
document.documentElement.style.width=W+'px';document.body.style.width=W+'px';document.body.style.height=H+'px';
const capH=Math.round(H*0.15),gap=Math.round(H*0.02);
const c=document.getElementById('cap');c.textContent=q.get('cap');
c.style.height=capH+'px';c.style.fontSize=Math.round(W*0.072)+'px';
const s=document.querySelector('.shot');s.style.marginBottom=Math.round(H*0.04)+'px';s.style.marginTop=gap+'px';
const im=document.getElementById('im');im.src=q.get('img');
// Round corners at the capture's own scale: radius ~ 3.3% of rendered width.
im.onload=()=>{const r=Math.round(im.getBoundingClientRect().width*0.055);im.style.borderRadius=r+'px';im.style.boxShadow='0 0 0 '+Math.max(3,Math.round(W*0.003))+'px #2a2f55';document.title='ready'};
</script>
