<!doctype html><meta charset="utf-8"><title>IAP promo</title>
<style>
@font-face{font-family:Outfit;font-weight:300;src:url(../../../fonts/outfit-latin-300-normal.woff2)}
@font-face{font-family:Outfit;font-weight:600;src:url(../../../fonts/outfit-latin-600-normal.woff2)}
@font-face{font-family:Outfit;font-weight:700;src:url(../../../fonts/outfit-latin-700-normal.woff2)}
@font-face{font-family:Outfit;font-weight:700;src:url(../../../fonts/outfit-latin-ext-700-normal.woff2);unicode-range:U+0100-02AF,U+1E00-1EFF}
@font-face{font-family:Orbitron;font-weight:700;src:url(../../../fonts/orbitron-latin-700-normal.woff2)}
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:1024px;overflow:hidden;background:#0a0d18}
#c{position:relative;width:1024px;height:1024px;font-family:Outfit,sans-serif;color:#eef0ff;
 background:radial-gradient(circle at 50% 38%,hsla(var(--h),85%,55%,.34),transparent 58%),#0a0d18}
.brand{position:absolute;top:52px;left:0;right:0;text-align:center;font:600 46px Outfit;letter-spacing:.04em;color:#9aa4cc}
.art{position:absolute;top:130px;left:162px;width:700px;height:520px}
.name{position:absolute;left:60px;right:60px;top:690px;text-align:center;font-weight:700;font-size:86px;line-height:1;letter-spacing:-.01em}
.name.long{font-size:68px}
.tag{position:absolute;left:70px;right:70px;top:805px;text-align:center;font-weight:300;font-size:38px;line-height:1.25;color:#cfd5f5}
.tag b{font-weight:600;color:hsl(var(--h),90%,70%)}
.pill{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);padding:10px 34px;border-radius:40px;
 border:2px solid hsla(var(--h),85%,65%,.7);font:600 26px Outfit;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--h),90%,75%)}
svg{width:100%;height:100%;overflow:visible}
</style>
<div id="c"></div>
<script>
const P={
sampler:{h:18,name:'Sampler Engine',tag:'Load <b>your own samples</b>. Slice any loop across the pads. Every sample kit.',pill:'One-time pack'},
synth:{h:268,name:'mõdSynth Engine',tag:'A <b>wavetable powerhouse</b> with FM, ring mod and LFOs. Plus the full mõdFX rack.',pill:'One-time pack'},
groove:{h:42,name:'Groove Pack',tag:'<b>World grooves</b>, odd meters, extra kits, an aux channel and 64-step patterns.',pill:'One-time pack'},
theory:{h:140,name:'Theory Pack',tag:'Every <b>mode</b>, every chord, <b>neo-soul</b> voicings and pure tuning.',pill:'One-time pack'},
practice:{h:178,name:'Practice & Perform Pack',long:1,tag:'<b>Speed trainer</b>, loop bars, next-key and Stage mode.',pill:'One-time pack'},
studio:{h:212,name:'Studio Pack',tag:'Bounce <b>stems</b>, full-length audio and MIDI, and <b>unlimited</b> saved songs.',pill:'One-time pack'},
sounds:{h:330,name:'Sounds Pack',tag:'<b>Tonewheel organ</b>, e-piano, pads, vibes, vintage bass.',pill:'One-time pack'},
fullstudio:{h:0,rainbow:1,name:'Full Studio',tag:'<b>Every pack</b>, in one purchase.',pill:'Best value'},
complete:{h:0,rainbow:1,name:'Complete Your Studio',long:1,tag:'Unlock <b>every pack you don’t own yet</b>, for less.',pill:'Upgrade price'}
};
const HUES=[18,268,42,140,178,212,330];
const col=(h,l=62)=>`hsl(${h},88%,${l}%)`;
const art={
sampler:h=>{let s='';const hs=[40,90,150,110,60,170,230,140,70,120,190,100,50,150,200,90,40,70,110,60];
 hs.forEach((v,i)=>{const x=20+i*34,gap=0;s+=`<rect x="${x}" y="${190-v*.8}" width="22" height="${v*1.6}" rx="11" fill="${col(h,gap?40:62)}" opacity="${gap?.45:1}"/>`});
 s+=`<g stroke="#eef0ff" stroke-width="4" stroke-dasharray="10 8" opacity=".8"><line x1="224" y1="-10" x2="224" y2="320"/><line x1="462" y1="-10" x2="462" y2="320"/></g>`;
 for(let r=0;r<2;r++)for(let c=0;c<4;c++)s+=`<rect x="${150+c*100}" y="${390+r*62}" width="84" height="50" rx="14" fill="${col(h,r*4+c==5?65:30)}" opacity="${r*4+c==5?1:.55}"/>`;
 return s},
synth:h=>{let s='';for(let k=0;k<7;k++){const t=k/6,y=260;let d='';for(let x=0;x<=700;x+=4){const p=x/700*Math.PI*4+k*.3;
  const sine=Math.sin(p),saw=2*((p/(2*Math.PI))%1)-1;const v=sine*(1-t)+saw*t;d+=(x?'L':'M')+x+' '+(y-(k-3)*30+v*70)}
  s+=`<path d="${d}" fill="none" stroke="${col(h+k*8,60)}" stroke-width="${k==3?10:6}" stroke-linecap="round" opacity="${k==3?1:.55}"/>`}
 s+=`<g fill="none" stroke="#eef0ff" stroke-width="5" opacity=".8"><circle cx="90" cy="470" r="34"/><circle cx="350" cy="470" r="34"/><circle cx="610" cy="470" r="34"/></g><g stroke="${col(h)}" stroke-width="6" stroke-linecap="round"><path d="M90 470l16-16M350 470l-12 18M610 470l20 6"/></g>`;return s},
groove:h=>{let s='';const on=[[0,4,8,12],[2,6,10,14],[3,7,11,15],[5,13]];
 for(let r=0;r<4;r++)for(let c=0;c<16;c++){const hit=on[r].includes(c);const x=14+c*42,y=40+r*118;
  s+=`<rect x="${x}" y="${y}" width="34" height="${hit?96:34}" rx="${hit?17:10}" fill="${hit?col(h+r*14):'#20233a'}" ${hit?'':`transform="translate(0 31)"`}/>`}
 s+=`<rect x="0" y="0" width="700" height="520" fill="none"/>`;return s},
theory:h=>{let s='';const cx=350,cy=260,R=210;const pts=[];
 for(let i=0;i<12;i++){const a=-Math.PI/2+i*Math.PI/6,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);pts.push([x,y]);
  s+=`<circle cx="${x}" cy="${y}" r="30" fill="${col(h+i*30,i%3==0?60:34)}"/>`}
 s+=`<polygon points="${[0,4,8].map(i=>pts[i].join(',')).join(' ')}" fill="${col(h,60)}" fill-opacity=".22" stroke="${col(h,70)}" stroke-width="7" stroke-linejoin="round"/>`;
 s+=`<circle cx="${cx}" cy="${cy}" r="120" fill="none" stroke="#20233a" stroke-width="6"/><circle cx="${cx}" cy="${cy}" r="36" fill="#eef0ff"/>`;return s},
practice:h=>{let s='';
 for(let i=0;i<8;i++){const x=20+i*84,hot=i>=3&&i<=5;s+=`<rect x="${x}" y="${hot?140:200}" width="68" height="${hot?220:100}" rx="14" fill="${col(h,hot?60:30)}" opacity="${hot?1:.6}"/>`}
 s+=`<path d="M140 90 H560 a40 40 0 0 1 40 40 v10" fill="none" stroke="#eef0ff" stroke-width="10" stroke-linecap="round"/><path d="M140 90 l24 -22 M140 90 l24 22" stroke="#eef0ff" stroke-width="10" stroke-linecap="round"/>`;
 s+=`<path d="M60 470 L180 410 L300 440 L420 380 L540 410 L660 340" fill="none" stroke="${col(h+20,70)}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>`;
 [60,180,300,420,540,660].forEach((x,i)=>s+=`<circle cx="${x}" cy="${[470,410,440,380,410,340][i]}" r="13" fill="#eef0ff"/>`);return s},
studio:h=>{let s='';const lanes=[0,1,2,3];
 lanes.forEach(r=>{const y=30+r*118;s+=`<rect x="0" y="${y}" width="700" height="92" rx="20" fill="#11152a" stroke="${col(h+r*22,50)}" stroke-width="3"/>`;
  let d='';for(let x=24;x<=676;x+=6){const a=(Math.sin(x*.05+r*2)*.5+.5)*(Math.sin(x*.013+r)*.4+.6)*34+4;d+=`<line x1="${x}" y1="${y+46-a}" x2="${x}" y2="${y+46+a}" stroke="${col(h+r*22,64)}" stroke-width="4" stroke-linecap="round"/>`}s+=d});
 s+=`<line x1="420" y1="0" x2="420" y2="520" stroke="#eef0ff" stroke-width="4"/>`;return s},
sounds:h=>{let s='';const w=[0,1,3,4,5,7,8,10,11,12,14,15];
 for(let i=0;i<10;i++)s+=`<rect x="${i*70+6}" y="60" width="62" height="400" rx="12" fill="#eef0ff"/>`;
 [0,1,3,4,5,7,8].forEach((i,j)=>{s+=`<rect x="${i*70+46}" y="60" width="44" height="240" rx="10" fill="#0a0d18" stroke="${col(h+j*10,62)}" stroke-width="4"/>`});
 [[1,3],[3,5],[5,6]].forEach((c,j)=>c.forEach(k=>s+=`<circle cx="${k*70+37}" cy="400" r="22" fill="${col(h+j*40,60)}"/>`));
 s+=`<path d="M0 500 Q175 450 350 500 T700 500" fill="none" stroke="${col(h+30,70)}" stroke-width="8" stroke-linecap="round"/>`;return s},
fullstudio:()=>{let s='';const cx=350,cy=260;
 HUES.forEach((h,i)=>{const a=-Math.PI/2+i*2*Math.PI/7,x=cx+190*Math.cos(a),y=cy+190*Math.sin(a);
  s+=`<circle cx="${x}" cy="${y}" r="58" fill="none" stroke="${col(h,62)}" stroke-width="22"/>`});
 s+=`<circle cx="${cx}" cy="${cy}" r="86" fill="none" stroke="#eef0ff" stroke-width="34"/>`;return s},
complete:()=>{let s='';const cx=350,cy=260;const own=[0,2,5];
 HUES.forEach((h,i)=>{const a=-Math.PI/2+i*2*Math.PI/7,x=cx+190*Math.cos(a),y=cy+190*Math.sin(a),o=own.includes(i);
  s+=`<circle cx="${x}" cy="${y}" r="58" fill="${o?col(h,40):'none'}" fill-opacity="${o?.35:0}" stroke="${col(h,62)}" stroke-width="22" ${o?'':'stroke-dasharray="26 18"'} opacity="${o?1:.9}"/>`});
 s+=`<circle cx="${cx}" cy="${cy}" r="86" fill="none" stroke="#eef0ff" stroke-width="34"/>`;return s}
};
const id=location.hash.slice(1)||'fullstudio',p=P[id];
const c=document.getElementById('c');c.style.setProperty('--h',p.h);
if(p.rainbow)c.style.background='radial-gradient(circle at 50% 38%,rgba(150,120,255,.30),transparent 58%),#0a0d18';
c.innerHTML=`<div class="brand">m&otilde;dR&iuml;ff</div><div class="art"><svg viewBox="0 0 700 520">${art[id](p.h)}</svg></div>
<div class="name ${p.long?'long':''}">${p.name}</div><div class="tag">${p.tag}</div><div class="pill">${p.pill}</div>`;
</script>
