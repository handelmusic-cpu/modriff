<!doctype html>
<!-- The 1024 x 1024 promotional image for one in-app purchase: promo.html?id=<key>.
     Rendered by render.mjs (Chrome, no dependencies), one PNG per product ID.
     Copy comes from MODULE_COPY / BUNDLE_COPY in index.html, written out here because the
     page cannot import from a 70k-line app; if a pack's name, line or bullets change there,
     change them here and re-render. Shows no price (storefront-dependent) and names no other
     product. The seven pack colours are the seven colours of the wordmark rainbow. -->
<meta charset="utf-8">
<title>IAP promo</title>
<style>
@font-face{font-family:Orbitron;font-weight:900;src:url(../../../fonts/orbitron-latin-900-normal.woff2) format('woff2')}
@font-face{font-family:Orbitron;font-weight:700;src:url(../../../fonts/orbitron-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:400;src:url(../../../fonts/outfit-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:500;src:url(../../../fonts/outfit-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:600;src:url(../../../fonts/outfit-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Outfit;font-weight:700;src:url(../../../fonts/outfit-latin-700-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1024px;height:1024px;background:#05060c;overflow:hidden}
body{position:relative;font-family:Outfit,sans-serif;color:#f2f3fa;--a:#ff9a3c}
.glow{position:absolute;inset:0;background:
  radial-gradient(circle at 50% -8%, color-mix(in srgb,var(--a) 34%,transparent), transparent 58%),
  radial-gradient(circle at 100% 100%, color-mix(in srgb,var(--a) 14%,transparent), transparent 50%)}
.top{position:absolute;left:80px;right:80px;top:68px;display:flex;justify-content:space-between;align-items:baseline}
.mark{font-weight:700;font-size:44px;letter-spacing:.5px}
.mark i{font-style:italic;color:var(--a)}
.kind{font-weight:600;font-size:24px;letter-spacing:6px;text-transform:uppercase;color:var(--a)}
.rule{position:absolute;left:80px;right:80px;top:140px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--a),transparent 85%)}
h1{position:absolute;left:80px;max-width:864px;top:196px;white-space:nowrap;font-family:Orbitron,sans-serif;font-weight:900;line-height:1.08;letter-spacing:.5px}
body.rainbow h1{background:linear-gradient(90deg,#ff5a5f,#ff9a3c,#ffd23f,#5fdc6a,#2ad4c8,#3a9bff,#b46bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.line{position:absolute;left:80px;right:80px;text-wrap:balance;font-weight:500;font-size:46px;line-height:1.2;color:#cfd3ea}
ul{position:absolute;left:80px;right:80px;list-style:none}
li{position:relative;padding-left:48px;font-size:36px;line-height:1.25;margin-bottom:20px;color:#e9ebf7}
li::before{content:"";position:absolute;left:4px;top:.42em;width:20px;height:20px;border-radius:50%;background:var(--a);box-shadow:0 0 18px var(--a)}
.bar{position:absolute;left:80px;right:80px;bottom:128px;display:flex;gap:12px}
.seg{flex:1;height:30px;border-radius:8px}
.seg.on{box-shadow:0 0 22px currentColor}
.seg.off{background:#1b1e36}
.foot{position:absolute;left:80px;right:80px;bottom:62px;display:flex;justify-content:space-between;font-size:26px;letter-spacing:4px;text-transform:uppercase;color:#8d92b5;font-weight:500}
</style>
<body>
<div class="glow"></div>
<div class="top"><div class="mark">mõd<i>Rïff</i></div><div class="kind" id="kind"></div></div>
<div class="rule"></div>
<h1 id="h1"></h1>
<div class="line" id="line"></div>
<ul id="ul"></ul>
<div class="bar" id="bar"></div>
<div class="foot"><span id="f1"></span><span id="f2"></span></div>
<script>
// Rainbow order = the store screen's pack order.
var COL=['#ff5a5f','#ff9a3c','#ffd23f','#5fdc6a','#2ad4c8','#3a9bff','#b46bff'];
var P={
 sounds:   {c:0,t:['Sounds','Pack'],        s:104,l:'Organ, electric piano, pads, vibes and bass',b:['Tonewheel organ and electric piano','Synth piano and synth pad','Vibraphone, violin bass and soul bass']},
 sampler:  {c:1,t:['Sampler','Engine'],     s:104,l:'Real instruments, 16 pads, your own samples',b:['Sampled instruments and every sample kit','Load your own samples onto the pads','Slice a loop across the pads']},
 synth:    {c:2,t:['mõdSynth','Engine'],s:104,l:'The full mõdSynth sound library and all mõdFX',b:['Every mõdSynth sound set','The full mõdFX library on the XY pad','Save your own patches']},
 groove:   {c:3,t:['Groove','Pack'],        s:104,l:'Every drum kit, world groove and odd meter',b:['Latin and world rhythms','More drum kits, plus the aux channel','Odd meters and patterns past 16 steps']},
 theory:   {c:4,t:['Theory','Pack'],        s:104,l:'Every scale, chord and voicing. Play anything',b:['Every mode and exotic scale','Every chord type and voicing','Pure tuning and circle-of-fifths colours']},
 practice: {c:5,t:['Practice &','Perform Pack'],s:78,l:'Speed trainer, timeline, Stage, chart import',b:['Speed trainer, next key, loop bars','Timeline and Stage mode for the stand','A practice library apart from your saves']},
 studio:   {c:6,t:['Studio','Pack'],        s:104,l:'Export full songs and stems. Unlimited saves',b:['Export stems, one file per part','Full-length audio and MIDI export','Unlimited saved songs']}
};
var KEYS=['sounds','sampler','synth','groove','theory','practice','studio'];
var id=new URLSearchParams(location.search).get('id'), d;
if(P[id]){
 d=P[id]; document.body.style.setProperty('--a',COL[d.c]);
 kind.textContent='Pack '+(KEYS.indexOf(id)+1)+' of 7';
 f1.textContent='One-time purchase'; f2.textContent='No subscription';
 bar.innerHTML=KEYS.map(function(k,i){return '<div class="seg '+(i===KEYS.indexOf(id)?'on':'off')+'" style="'+(i===KEYS.indexOf(id)?'background:'+COL[i]+';color:'+COL[i]:'')+'"></div>';}).join('');
} else if(id==='fullstudio'){
 d={t:['Full Studio'],s:118,l:'Every pack, in one purchase',b:['All seven packs','One purchase, no subscription']};
 document.body.classList.add('rainbow'); document.body.style.setProperty('--a','#b46bff');
 kind.textContent='Everything'; f1.textContent='One-time purchase'; f2.textContent='All seven packs';
 bar.innerHTML=COL.map(function(c){return '<div class="seg on" style="background:'+c+';color:'+c+'"></div>';}).join('');
} else { // from1, from2, from3plus
 var own={from1:1,from2:2,from3plus:3}[id], more=id==='from3plus'?'Own three or more':'Own '+['','one','two'][own];
 d={t:['Complete','Your Studio'],s:92,l:'Finish your set: every pack you don’t own yet',
    b:[more+(own===1?' pack?':' packs?')+(id==='from3plus'?'':' Get the rest in one go'),'Every pack you don’t have yet','Plus every pack added later']};
 if(id==='from3plus') d.b[0]='Own three or more packs? Get what’s left';
 document.body.classList.add('rainbow'); document.body.style.setProperty('--a','#2ad4c8');
 kind.textContent='Upgrade'; f1.textContent='One-time purchase'; f2.textContent=id==='from3plus'?'3+ packs owned':own+(own===1?' pack owned':' packs owned');
 bar.innerHTML=COL.map(function(c,i){return i<own?'<div class="seg off"></div>':'<div class="seg on" style="background:'+c+';color:'+c+'"></div>';}).join('');
}
h1.innerHTML=d.t.join('<br>'); h1.style.fontSize=d.s+'px';
// Not `top`: at page scope that is window.top, which cannot be assigned, so the sum came out as text.
var y0=196+d.t.length*d.s*1.08+26;
line.textContent=d.l; line.style.top=y0+'px';
var lh=Math.ceil(line.getBoundingClientRect().height);
ul.style.top=(y0+lh+34)+'px';
ul.innerHTML=d.b.map(function(x){return '<li>'+x+'</li>';}).join('');
</script>
